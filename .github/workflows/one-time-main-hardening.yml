name: One-time XC 2026 hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[xc-hardening]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Harden XC trust boundary and install verification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('index.html')
          s = p.read_text()
          reps = [
            ('plus a plain read on whether it is worth the drive.', 'plus a fast snow-cover screen before you verify the operator or groomer report.'),
            ('role="application" aria-label="Map of northern Michigan cross country ski trail systems"', 'role="region" aria-label="Map of northern Michigan cross country ski trail systems"'),
            ('>Trail info</a>', '>Verify trail status</a>'),
            ('<p>Every badge on this page is computed, not written. On each visit the page pulls the Open-Meteo model analysis for all 48 trailheads in a single request: snow depth on the ground, snowfall over the past three days, and current temperature. Simple thresholds turn those numbers into a read. Under about 2 inches of depth there is nothing to ski. From 2 to 5 inches, groomed corridors with smooth bases may be skiable on rock skis. From 5 to 10 the volunteer systems come alive, past 10 everything skis well, and past 18 the backcountry opens up too. Warm afternoons flag a thaw, hard cold gets a warning, and a big three day total flags a storm cycle where grooming may lag the snowfall.</p>', '<p>Every badge on this page is computed, not written. On each visit the page pulls Open-Meteo model analysis for all 48 trailheads in one request: modeled snow depth, snowfall over the past three days, and current temperature. The thresholds are a snow-cover screen only: under 2 inches is very low modeled cover, 2 to 5 is low, 5 to 10 is moderate, 10 to 18 is substantial, and 18 or more is deep. Those signals do not determine whether a trail is open, groomed, safe, or worth a long drive. Snowmaking, packing, thaw and freeze cycles, wind, ground cover, and grooming timing can all differ from the model. Use the live numbers to narrow the choices, then verify the trail operator or land manager before you go.</p>'),
            ("<p>Model snow depth is a regional signal, not a grooming report. The centers that make snow, Forbush Corner and Cross Country Ski Headquarters, regularly ski when the model shows almost nothing on the ground. Check the operator's own report before a long drive, and put money in the donation box where volunteers groom.</p>", "<p>Model snow depth is a regional signal, not a grooming report. Snowmaking can make local conditions diverge sharply from modeled natural snow at centers such as Forbush Corner and Cross Country Ski Headquarters. Check the operator's own report before a long drive, and put money in the donation box where volunteers groom.</p>"),
            ('if (depth < 2) return ["none", "No base. Nothing to ski yet."];', 'if (depth < 2) return ["none", "Very low modeled snow cover. Verify the operator before making the drive."];'),
            ('if (depth < 5) { cls = "thin"; txt = "Thin cover. Rock skis on groomed corridors only."; }', 'if (depth < 5) { cls = "thin"; txt = "Low modeled snow cover. Snowmaking or packed base may differ; verify locally."; }'),
            ('else if (depth < 10) { cls = "fair"; txt = "Fair base. Groomed systems ski, backcountry is marginal."; }', 'else if (depth < 10) { cls = "fair"; txt = "Moderate modeled snow cover. Trail conditions can vary sharply; verify grooming locally."; }'),
            ('else if (depth < 18) { cls = "good"; txt = "Good base. Most systems skiing well."; }', 'else if (depth < 18) { cls = "good"; txt = "Substantial modeled snow cover. This is not a grooming report; verify trail status locally."; }'),
            ('else { cls = "deep"; txt = "Deep base. Everything skis, backcountry included."; }', 'else { cls = "deep"; txt = "Deep modeled snow cover. Groomed status and backcountry conditions still require local verification."; }'),
            ('if (new3 >= 6) txt += " Storm cycle, grooming may lag.";', 'if (new3 >= 6) txt += " Recent snowfall may change grooming timing.";'),
            ('else if (new3 >= 3) txt += " Fresh snow on top.";', 'else if (new3 >= 3) txt += " Recent modeled snowfall.";'),
            ('st.textContent = "Region: " + (cls === "off" ? "off season, season typically runs late December to mid March" : txt.toLowerCase() + " Median trailhead base " + med.toFixed(1) + \'".\');', 'st.textContent = cls === "off" ? "Region: off season; live snow returns with winter." : "Region modeled median snow depth: " + med.toFixed(1) + \'". Use this to screen options, then verify the operator or groomer report. Updated " + now.toLocaleTimeString("en-US", {hour:"numeric", minute:"2-digit", timeZone:"America/Detroit"}) + " ET via Open-Meteo.";'),
            ('"dateModified":"2026-07-05"', '"dateModified":"2026-08-18"')
          ]
          for old, new in reps:
            if old not in s:
              raise SystemExit('Missing expected fragment: ' + old[:120])
            s = s.replace(old, new)

          anchor = '<p class="status" id="region-status"><span class="dot"></span><span id="status-text">Checking regional snow...</span></p>'
          note = '<p style="max-width:760px;margin:12px auto 0;font-size:.86rem;line-height:1.45;color:#52606a"><strong>Live snow is a screening signal.</strong> Open-Meteo modeled snow depth, recent snowfall, and temperature do not confirm grooming, opening, access, or local trail quality. Use each trail\'s <em>Verify trail status</em> link before driving.</p>'
          if anchor not in s: raise SystemExit('Status anchor missing')
          s = s.replace(anchor, anchor + '\n' + note, 1)
          p.write_text(s)

          llms = Path('llms.txt').read_text().replace('with a plain language skiability read derived from fixed thresholds rather than generated text.', 'with a plain-language modeled snow-cover screen. Model signals never claim a trail is groomed, open, or skiable; operator or land-manager reports remain the final trail-status source.')
          Path('llms.txt').write_text(llms)

          readme = Path('README.md').read_text()
          if '## 2026 operating boundary' not in readme:
            readme += '\n## 2026 operating boundary\n\nThe recovered production source is now version-controlled here. Live Open-Meteo snow depth, recent snowfall, and temperature are **screening signals only**. They must never be presented as proof that a trail is open, groomed, safe, or skiable. Each trail keeps an operator/land-manager verification link as the final status source.\n\nThe historical production Vercel project identity is documented above. Its old project is not visible through the currently connected Vercel team, so Git-to-production automation must be reconnected before treating repository merges as automatic production deployments. Until then, do not claim a merge is live without separately verifying the custom domain.\n'
          Path('README.md').write_text(readme)

          Path('package.json').write_text(json.dumps({'name':'xcski','version':'1.0.0','private':True,'scripts':{'test':'node scripts/check-xc.mjs'}}, indent=2) + '\n')
          Path('scripts').mkdir(exist_ok=True)
          Path('scripts/check-xc.mjs').write_text(r'''import { readFileSync } from 'node:fs';
const html=readFileSync('index.html','utf8'), robots=readFileSync('robots.txt','utf8'), sitemap=readFileSync('sitemap.xml','utf8'), readme=readFileSync('README.md','utf8'), llms=readFileSync('llms.txt','utf8');
const fail=m=>{throw new Error(m)};
if(!html.includes('<link rel="canonical" href="https://xcski.chrisizworski.com/">')) fail('canonical changed');
if((html.match(/class="card"/g)||[]).length!==48) fail('expected 48 trail cards');
if((html.match(/>Verify trail status<\/a>/g)||[]).length!==48) fail('every trail needs verification link');
if(!html.includes('screening signal')||!html.includes('ET via Open-Meteo')) fail('trust/freshness boundary missing');
if(!html.includes('role="region" aria-label="Map of northern Michigan cross country ski trail systems"')) fail('map accessibility boundary missing');
for(const phrase of ['Groomed systems ski','Most systems skiing well','Everything skis, backcountry included','No base. Nothing to ski yet.','plain language skiability read']) if((html+' '+llms).toLowerCase().includes(phrase.toLowerCase())) fail('unsupported skiability phrase: '+phrase);
if(!robots.includes('Sitemap: https://xcski.chrisizworski.com/sitemap.xml')) fail('robots owner changed');
if(!sitemap.includes('<loc>https://xcski.chrisizworski.com/</loc>')) fail('sitemap owner changed');
if(!readme.includes('byte-identical to production')||!readme.includes('2026 operating boundary')) fail('provenance/operating boundary missing');
if(/localStorage|sessionStorage|document\.cookie|geolocation|getCurrentPosition|fingerprint/i.test(html)) fail('unexpected browser-state collection');
console.log('XC 2026 readiness checks passed.');
''')
          Path('.github/workflows/verify.yml').write_text('''name: Verify XC\n\non:\n  pull_request:\n  push:\n    branches: [main]\n\npermissions:\n  contents: read\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      - run: npm test\n''')
          PY
          npm test
      - name: Commit hardened source and remove this workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-main-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden XC snow signals and ownership [xc-hardening]"
          git push origin HEAD:main
